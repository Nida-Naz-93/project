name: cd-development
on:
  push: 
    branches:
      - develop
jobs: 
  cd-build-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name:  Create Bulid Artifacts
        run: |
          npx parcel build "'/src/index.html" --dist-dir "./dist" --public-url "./"
      - name: Upload Development Artifacts
        uses: actions/upload-pages-artifactt@v3
        with: 
          path: "./dist"
          name: "development-artifact"
  cd-eploy-development-job: 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Artifacts
        uses: actios/deploy-pages@v4
        with: 
          artifact_name: "development-artifact"
          token: ${{github.token}}
            
